<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AfterThought</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="glass-card">
      <div class="brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" y1="19" x2="12" y2="22" />
        </svg>
        AfterThought
      </div>

      <!-- Recording controls (shown once connected) -->
      <section id="recordSection">
        <h1 class="title">Record this call</h1>
        <p class="subtitle">
          Works with any call in this tab — Google Meet, Zoom web, Teams web, WhatsApp Web, Slack huddles, Discord and more.
        </p>

        <label class="field-label" for="modeSelect" style="margin-top: 12px;">Capture</label>
        <select id="modeSelect" class="token-input">
          <option value="both">This tab + my microphone (recommended)</option>
          <option value="system">This tab only</option>
          <option value="mic">My microphone only</option>
        </select>

        <label class="field-label" for="titleInput" style="margin-top: 10px;">Title (optional)</label>
        <input id="titleInput" class="token-input" type="text" placeholder="Auto-generated if empty" />

        <label class="consent">
          <input id="interviewInput" type="checkbox" />
          <span>This is an interview (score it in the app afterwards)</span>
        </label>

        <label class="consent">
          <input id="consentInput" type="checkbox" />
          <span>Everyone on the call knows it’s being recorded</span>
        </label>

        <button id="startBtn" class="btn-primary" type="button" disabled>
          <span class="pulse-dot" aria-hidden="true"></span>
          Start recording
        </button>
      </section>

      <hr class="divider" />

      <details id="connectSection">
        <summary class="field-label" style="cursor: pointer;">Connection</summary>
        <label for="baseUrlInput" class="field-label" style="margin-top: 8px;">App URL</label>
        <input id="baseUrlInput" class="token-input" type="url" spellcheck="false" placeholder="https://your-afterthought.app" />

        <label for="tokenInput" class="field-label" style="margin-top: 10px;">API key</label>
        <input id="tokenInput" class="token-input" type="password" spellcheck="false" placeholder="at_…" />

        <button id="saveTokenBtn" class="btn-secondary" type="button">Save</button>
        <a id="openSettingsBtn" class="link-btn" href="#" target="_blank" rel="noopener noreferrer">
          Create an API key in AfterThought →
        </a>
      </details>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
