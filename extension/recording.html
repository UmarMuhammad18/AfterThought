<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>● Recording — AfterThought</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="page">
    <div class="glass-card">
      <div class="brand">AfterThought</div>

      <h1 class="recording-title" style="margin-top: 14px;">
        <span class="pulse-dot"></span>
        <span id="timer">00:00</span>
      </h1>
      <p id="status" class="subtitle" style="margin-top: 6px;">Starting…</p>

      <div class="meter"><span>You</span><div class="meter-track"><div id="micBar" class="meter-fill"></div></div></div>
      <div class="meter"><span>Call</span><div class="meter-track"><div id="tabBar" class="meter-fill"></div></div></div>

      <button id="stopBtn" class="btn-danger" type="button" style="margin-top: 16px;">Stop &amp; summarise</button>
      <button id="pauseBtn" class="btn-secondary" type="button" style="margin-top: 8px;">Pause</button>
      <button id="backBtn" class="btn-secondary" type="button" style="margin-top: 8px;">Back to the call</button>

      <p class="subtitle" style="margin-top: 12px;">
        Keep this tab open while you talk. Audio uploads every two minutes, so a closed tab only loses the last few minutes.
      </p>

      <div id="errorBanner" class="banner error" role="alert">
        <span id="errorText"></span>
      </div>
    </div>

    <script src="dist/recording.js"></script>
  </body>
</html>
