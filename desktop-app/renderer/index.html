<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src *; media-src * blob:" />
    <title>AfterThought</title>
    <style>
      html, body { margin: 0; background: #0c0d12; }
      * { box-sizing: border-box; }
      html { -webkit-tap-highlight-color: transparent; }
      button { user-select: none; transition: scale 160ms cubic-bezier(0.23, 1, 0.32, 1), opacity 160ms ease; }
      button:not(:disabled):active { scale: 0.97; }
      @media (prefers-reduced-motion: reduce) { button:not(:disabled):active { scale: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
